<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería | Elinspirarte</title>
    <!-- Fuentes de Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    <!-- Estilos -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Navegación -->
    <header class="header">
        <div class="container nav-container">
            <a href="index.html#inicio" class="logo-link"><img src="assets/images/logo.jpg" alt="ElinspirArte Logo" class="logo-img"></a>
            <button class="mobile-menu-btn" aria-label="Abrir menú">&#9776;</button>
            <nav class="nav-links">
                <a href="index.html#inicio">Inicio</a>
                <a href="galeria.html" style="color: var(--primary-color);">Galería</a>
                <a href="index.html#quien-soy">Quién Soy</a>
                <a href="index.html#contacto">Contacto</a>
            </nav>
        </div>
    </header>

    <main>
        <!-- Sección Galería -->
        <section id="galeria" class="section">
            <div class="container">
                <h2 class="section-title">Mi Galería Completa</h2>
                <p class="section-subtitle">Explora todas mis creaciones. Arte hecho con intención y propósito de sanación.</p>
                
                <!-- Grid de la galería cargado dinámicamente -->
                <div class="gallery-grid" id="gallery-grid">
                    <!-- Los items se cargarán por JS -->
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; <span id="year"></span> Elinspirarte. Todos los derechos reservados.</p>
        </div>
    </footer>

    <!-- Modal para detalles de la artesanía -->
    <div id="craft-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <div class="modal-body">
                <div class="modal-image">
                    <img id="modal-img" src="" alt="Artesanía">
                </div>
                <div class="modal-info">
                    <h2 id="modal-title">Título</h2>
                    <p class="modal-technique"><strong>Técnica / Propósito:</strong> <span id="modal-tech"></span></p>
                    <p id="modal-desc" class="modal-description">Descripción detallada</p>
                    <a href="index.html#contacto" class="btn btn-primary btn-consult" onclick="document.getElementById('craft-modal').classList.remove('active')">Consultar por esta pieza</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/app.js"></script>
</body>
</html>
